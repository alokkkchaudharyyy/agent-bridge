# Publishes a release when a v* tag is pushed:
# tests -> build .vsix -> GitHub release -> Open VSX (trusted publishing, no token).
# Can also be run by hand for an existing tag (Actions tab -> Release -> Run workflow).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v0.3.1'
        required: true

permissions:
  contents: write   # create the GitHub release
  id-token: write   # Open VSX trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check tag matches package.json version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build .vsix
        run: python3 scripts/pack.py

      - name: Release notes from CHANGELOG
        run: |
          python3 - <<'EOF'
          import os
          version = os.environ['VERSION']
          text = open('CHANGELOG.md', encoding='utf-8').read()
          start = text.index(f'## [{version}]')
          end = text.find('\n## [', start + 1)
          body = text[start:end if end != -1 else None].split('\n', 1)[1].strip()
          body += f'\n\nInstall from Open VSX (search "Agent Bridge"), or download agent-bridge-{version}.vsix below and use Extensions > ... > Install from VSIX.\n'
          open('release-notes.md', 'w', encoding='utf-8').write(body)
          EOF

      - name: GitHub release
        run: |
          FILE="agent-bridge-$VERSION.vsix"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --title "Agent Bridge $TAG" --notes-file release-notes.md
          fi

      - name: Publish to Open VSX
        run: npx --yes ovsx@1.2.0 publish --packagePath "agent-bridge-$VERSION.vsix" --trusted-publishing
